
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto</title>
</head>
<body>

    <h1>Formulario de contacto</h1>

    <form>
        <label>Nombre:</label>
        <input type="text" name="nombre" required>

        <br><br>

        <label>Correo:</label>
        <input type="email" name="correo" required>

        <br><br>

        <label>Mensaje:</label>
        <textarea name="mensaje" required></textarea>

        <br><br>

        <button type="submit">Enviar</button>
    </form>

</body>
</html>
